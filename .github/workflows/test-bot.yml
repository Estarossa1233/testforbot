name: Test Bot Full

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          if curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
            echo "Ollama sudah berjalan."
          else
            ollama serve > ollama.log 2>&1 &
            sleep 10
          fi

      - name: Download AI model
        run: |
          ollama pull qwen2.5:7b

      - name: Install dependencies
        run: |
          npm install

      - name: Start Telegram Bot
        env:
          PORT: 3000
          OLLAMA_URL: http://127.0.0.1:11434/api/chat
          OLLAMA_MODEL: qwen2.5:7b
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_POLLING: "true"
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

          echo "Menunggu server..."
          sleep 10

          echo "===== SERVER STATUS ====="
          curl --fail http://127.0.0.1:3000/api/status

          echo ""
          echo "===== TELEGRAM BOT AKTIF ====="
          echo "Silakan kirim pesan ke bot Telegram."
          echo "Bot akan aktif selama 10 menit."

          sleep 600

      - name: Show server log
        if: always()
        run: |
          echo "===== SERVER LOG ====="
          cat server.log || true

          echo ""
          echo "===== OLLAMA LOG ====="
          cat ollama.log || true

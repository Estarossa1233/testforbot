name: Test Bot Full

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          sleep 10

      - name: Download AI model
        run: |
          ollama pull qwen2.5:1.5b

      - name: Install dependencies
        run: |
          npm install

      - name: Start server
        env:
          PORT: 3000
          OLLAMA_URL: http://127.0.0.1:11434/api/chat
          OLLAMA_MODEL: qwen2.5:1.5b
          TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN"
          BOT_POLLING: "true"
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          sleep 10

      - name: Test server status
        run: |
          echo "Testing /api/status..."
          curl --fail http://127.0.0.1:3000/api/status

      - name: Test AI chat
        run: |
          echo ""
          echo "Testing /api/chat..."

          curl --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Jawab singkat: apakah AI aktif?"}' \
            http://127.0.0.1:3000/api/chat

      - name: Show server log
        if: always()
        run: |
          echo "===== SERVER LOG ====="
          cat server.log || true

          echo ""
          echo "===== OLLAMA LOG ====="
          cat ollama.log || true

name: Test Bot Full

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          sleep 10

          echo "===== OLLAMA STATUS ====="
          curl --fail http://127.0.0.1:11434/api/tags

      - name: Download AI model
        run: |
          ollama pull qwen2.5:7b

      - name: Install dependencies
        run: |
          npm install

      - name: Test Aiven DNS
        env:
          DB_HOST: mysql-65b8a81-duyencavez-9525.d.aivencloud.com
          DB_PORT: 15364
          
        run: |
          echo "===== TEST AIVEN DNS ====="
          echo "Host length: ${#DB_HOST}"
          echo "Port: $DB_PORT"

          echo "===== DNS LOOKUP ====="
          getent hosts "$DB_HOST" || true

          echo "===== DNS CHECK ====="
          if getent hosts "$DB_HOST" > /dev/null 2>&1; then
            echo "✅ DB_HOST berhasil ditemukan"
          else
            echo "❌ DB_HOST tidak bisa ditemukan"
            exit 1
          fi

      - name: Start Telegram Bot
        env:
          PORT: 3000

          # =========================
          # OLLAMA
          # =========================
          OLLAMA_URL: http://127.0.0.1:11434/api/chat
          OLLAMA_MODEL: qwen2.5:7b

          # =========================
          # AIVEN MYSQL
          # =========================
          DB_HOST: mysql-65b8a81-duyencavez-9525.d.aivencloud.com
          DB_PORT: 15364
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: defaultdb
          DB_CA_PATH: ./certs/ca.pem

          # =========================
          # TELEGRAM
          # =========================
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}

        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

          echo "Menunggu server..."
          sleep 10

          echo "===== SERVER STATUS ====="
          curl --fail http://127.0.0.1:3000/api/status

          echo ""
          echo "===== TELEGRAM BOT AI AKTIF ====="
          echo "Silakan kirim pesan ke bot Telegram."
          echo "Bot akan aktif selama 6 jam test."

          for i in {1..360}; do
            echo ""
            echo "===== SERVER LOG $(date) ====="
            tail -n 50 server.log
            sleep 60
          done

      - name: Show server log
        if: always()
        run: |
          echo "===== SERVER LOG ====="
          cat server.log || true

          echo ""
          echo "===== OLLAMA LOG ====="
          cat ollama.log || true
